<!doctype html>
<!--
  Lot 295 — Écran TV (Smart TV, navigateur de télé) : page AUTONOME, écrite en JavaScript ancien (ES5, sans React ni bundle),
  pour fonctionner même sur le vieux moteur web d'une télé (webOS, Tizen…) où l'application SAWALI complète reste blanche.
  Adresse : /tv (redirigée ici) ou directement /tv-ecran.html.
  Fonctionnement identique au lot 289 : code d'appairage à saisir dans Paramètres → « Écrans TV », puis fil de la messagerie
  et demandes de support du client choisi. Les appels passent par /api (même adresse que le site, relayée vers le serveur).
  Toute erreur est AFFICHÉE en bas de l'écran (au lieu d'un écran blanc) pour faciliter le diagnostic.
-->

<body>
<div id="racine"><div class="centre"><div class="aide">Chargement de l'écran SAWALI…</div></div></div>
<div id="erreur"></div>
<script>
(function () {
  var CLE = "sawali_tv_secret", API = "/api", VERSION_PAGE = "328";   // doit être identique à PAGE_TV_VERSION (backend/routes/ecran_tv.py)
  // Lot 328 : « /tv-ecran.html?admin=1 » = page /suivi-rdv en mode ADMINISTRATEUR : même rendu que la télé, mais connecté avec le compte SAWALI
  // (jeton du site), sans appairage ni code PIN, patients en clair. Le téléphone de l'admin joue le rôle d'une télé de contrôle.
  var ADMIN = /[?&]admin=1/.test(window.location.search);
  var adminCode = "", adminExpire = 0, adminTimer = null;   // lot 323 : connexion administrateur approuvée depuis SAWALI (code affiché sur la télé)
  var horizon = 1, jeton = "", pinSaisie = "", pinMsg = "", pinEnvoi = false, derniere = new Date().getTime(), decalage = 0;   // lot 317 : jeton du code PIN (mémoire seulement), saisie en cours, décalage horloge télé ↔ serveur UTC
  var secretMem = "", dejaCharge = false, vus = {}, flux = null, hors = false, phase = "", code = "";
  var ctxSon = null, sonActif = false, filChoisi = "", curseur = -1, dernierNonLus = -1, dernierFils = [];
  // Lot 303 — non-lus déjà « vus » sur cette télé, par conversation (gardés dans la télé : survit au rechargement de la page)
  var photosMed = {}, nbFlux = 0, mode = "", idxMed = 0, forces = {};   // lot 304 : mode = "planning" (par défaut) ou "suivi"; idxMed = médecin affiché au carrousel
        // lot 303 : photos des médecins (demandées au serveur au démarrage puis toutes les ~10 min)
  var CLE_LUS = "sawali_tv_lus", lus = {};
  try { lus = JSON.parse(localStorage.getItem(CLE_LUS) || "{}") || {}; } catch (e) { lus = {}; }
  function sauverLus() { try { localStorage.setItem(CLE_LUS, JSON.stringify(lus)); } catch (e) {} }
  // Non-lus affichés = non-lus du serveur moins ceux déjà vus ici ; si le serveur en compte moins (lus ailleurs), on s'aligne
  function nonLusVisibles(f) {
    var vu = lus[f.cle] || 0;
    if (f.non_lus < vu) { lus[f.cle] = vu = f.non_lus; sauverLus(); }
    return Math.max(0, f.non_lus - vu);
  }
  var racine = document.getElementById("racine"), zoneErreur = document.getElementById("erreur");

  // Toute erreur est affichée en bas de l'écran (diagnostic sur la télé, sans console)
  function montrerErreur(m) { zoneErreur.style.display = "block"; zoneErreur.innerHTML = esc(String(m)).substring(0, 300); }
  window.onerror = function (msg, src, ligne) { montrerErreur("Erreur : " + msg + " (ligne " + ligne + ")"); };

  function esc(t) { return String(t == null ? "" : t).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;"); }
  function lire() { if (ADMIN) { return "admin"; } try { return localStorage.getItem(CLE) || secretMem; } catch (e) { return secretMem; } }
  function ecrire(v) { secretMem = v; try { if (v) { localStorage.setItem(CLE, v); } else { localStorage.removeItem(CLE); } } catch (e) {} }
  function fabriquer() {
    var s = "", i, h = "0123456789abcdef", b;
    for (i = 0; i < 48; i++) {
      if (window.crypto && window.crypto.getRandomValues) { b = window.crypto.getRandomValues(new Uint8Array(1))[0] % 16; }
      else { b = Math.floor(Math.random() * 16); }
      s += h.charAt(b);
    }
    return s;
  }
  function heure(iso) { var d = new Date(iso); if (isNaN(d.getTime())) { return ""; } return ("0" + d.getHours()).slice(-2) + ":" + ("0" + d.getMinutes()).slice(-2); }
  function jourHeure(iso) { var d = new Date(iso); if (isNaN(d.getTime())) { return ""; } return ("0" + d.getDate()).slice(-2) + "/" + ("0" + (d.getMonth() + 1)).slice(-2) + " " + heure(iso); }

  // Appel au serveur (XMLHttpRequest : le plus compatible) ; rappel(statut, objet)
  function appeler(methode, chemin, secret, corps, rappel) {
    var x = new XMLHttpRequest();
    // Lot 328 : en mode administrateur, le flux vient de /admin/suivi-rdv/flux et l'appel est authentifié par le jeton de connexion à SAWALI
    if (ADMIN && chemin.indexOf("/tv/flux") === 0) { chemin = "/admin/suivi-rdv/flux" + chemin.substring(8); }
    x.open(methode, API + chemin, true);
    x.timeout = 15000;
    if (ADMIN) { try { x.setRequestHeader("Authorization", "Bearer " + (localStorage.getItem("sawali_token") || "")); } catch (e) {} }
    else if (secret) { x.setRequestHeader("X-Tv-Secret", secret); }
    if (jeton) { x.setRequestHeader("X-Tv-Deverrou", jeton); }
    if (corps) { x.setRequestHeader("Content-Type", "application/json"); }
    x.onreadystatechange = function () {
      if (x.readyState !== 4) { return; }
      var d = null;
      try { d = JSON.parse(x.responseText); } catch (e) {}
      rappel(x.status, d);
    };
    x.ontimeout = function () { rappel(0, null); };
    x.send(corps ? JSON.stringify(corps) : null);
  }

  // ---------- Son : bip à chaque nouveau message reçu ----------
  // Un navigateur de télé n'autorise le son qu'après une action de l'utilisateur (touche OK de la télécommande) : tant que ce n'est
  // pas fait, un petit bandeau « Appuyez sur OK » s'affiche en haut de l'écran.
  function activerSon() {
    try {
      var Ctx = window.AudioContext || window.webkitAudioContext;
      if (!Ctx) { return; }
      if (!ctxSon) { ctxSon = new Ctx(); }
      if (ctxSon.resume) { ctxSon.resume(); }
      if (!sonActif) { sonActif = true; bip(); if (flux) { dessiner(); } }
    } catch (e) { montrerErreur("Son indisponible : " + e.message); }
  }
  function bip() {
    if (!ctxSon || !sonActif) { return; }
    try {
      var t = ctxSon.currentTime, i, freqs = [880, 1175];
      for (i = 0; i < freqs.length; i++) {
        var o = ctxSon.createOscillator(), g = ctxSon.createGain();
        o.frequency.value = freqs[i]; o.type = "sine";
        g.gain.setValueAtTime(0.0001, t + i * 0.18);
        g.gain.exponentialRampToValueAtTime(0.4, t + i * 0.18 + 0.02);
        g.gain.exponentialRampToValueAtTime(0.0001, t + i * 0.18 + 0.16);
        o.connect(g); g.connect(ctxSon.destination);
        o.start(t + i * 0.18); o.stop(t + i * 0.18 + 0.17);
      }
    } catch (e) { /* son impossible : on ignore */ }
  }
  // Lot 303 : au chargement, on tente d'activer le son sans geste ; certaines télés l'autorisent, sinon le bandeau « Appuyez sur OK »
  // reste affiché (règle des navigateurs : le son exige une action de l'utilisateur à chaque chargement de page).
  function essaiSonAuto() {
    try {
      var Ctx = window.AudioContext || window.webkitAudioContext;
      if (!Ctx) { return; }
      ctxSon = ctxSon || new Ctx();
      if (ctxSon.resume) { ctxSon.resume(); }
      setTimeout(function () { if (ctxSon && ctxSon.state === "running" && !sonActif) { sonActif = true; if (flux) { dessiner(); } } }, 600);
    } catch (e) { /* pas de son automatique : on attend un appui sur OK */ }
  }
  essaiSonAuto();
  document.addEventListener("click", activerSon, false);
  document.addEventListener("keydown", activerSon, false);
  document.addEventListener("touchstart", activerSon, false);

  // ---------- Choix d'une conversation (clic de la télécommande pointeur, ou flèches + OK) ----------
  function choisirFil(cle) {
    filChoisi = (cle === filChoisi) ? "" : cle;     // un second clic sur la même conversation revient à « tout afficher »
    if (filChoisi) { marquerVu(filChoisi); if (flux) { dessiner(); } }   // lot 303 : la pastille rouge se met à jour aussitôt
    vus = {}; dejaCharge = false;                    // le contenu change : pas d'animation ni de bip pour l'affichage initial

    dejaCharge = true;
  }
  function charger() {
    if (phase !== "flux") { return; }
    var avecPhotos = (nbFlux % 75 === 0);   // les photos (lourdes) ne sont demandées qu'au premier appel puis de temps en temps
    nbFlux++;
    appeler("GET", "/tv/flux?photos=" + (avecPhotos ? "1" : "0") + (filChoisi ? "&fil=" + encodeURIComponent(filChoisi) : "") + (horizon > 1 ? "&jours=" + horizon : ""), lire(), null, function (st, d) {
      if (phase !== "flux") { return; }
      if (st === 200 && d && d.hall && avecPhotos) {
        var q; photosMed = {};
        for (q = 0; q < d.hall.medecins.length; q++) { if (d.hall.medecins[q].photo) { photosMed[d.hall.medecins[q].medecin] = d.hall.medecins[q].photo; } }
      } else if (st === 200 && d && d.hall) {
        // une photo vient d'être ajoutée côté administration : on la demande au prochain appel
        var r2; for (r2 = 0; r2 < d.hall.medecins.length; r2++) { if (d.hall.medecins[r2].a_photo && !photosMed[d.hall.medecins[r2].medecin]) { nbFlux = 0; } }
      }
      if (ADMIN && (st === 401 || st === 403)) {      // lot 328 : pas connecté en administrateur → connexion SAWALI
        if (st === 401) { window.location.href = "/login"; } else { montrerErreur("Accès réservé aux administrateurs de SAWALI."); }
        return;
      }
      if (st === 401) { ecrire(""); flux = null; demarrerAppairage(); return; }
      // Lot 307 : le serveur annonce la version de la page ; si la télé a gardé une ancienne page en cache, elle se recharge
      // toute seule (adresse avec ?v= pour contourner le cache ; au plus 2 tentatives, pour ne jamais boucler)
      if (st === 200 && d && d.page && d.page !== VERSION_PAGE) {
        var essais = 0;
        try { essais = parseInt(sessionStorage.getItem("sawali_tv_rech") || "0", 10) || 0; } catch (e) {}
        if (essais < 2) {
          try { sessionStorage.setItem("sawali_tv_rech", String(essais + 1)); } catch (e) {}
          window.location.replace("/tv-ecran.html?" + (ADMIN ? "admin=1&" : "") + "v=" + encodeURIComponent(d.page) + "&t=" + new Date().getTime());
          return;
        }
      }
      if (st === 200 && d && d.maintenant) {      // lot 317 : écart entre l'horloge de la télé et l'heure UTC du serveur
        var sv = new Date(d.maintenant).getTime();
        if (!isNaN(sv)) { decalage = sv - new Date().getTime(); }
      }
      if (st === 200 && d && d.ecran && d.ecran.suivi_ouvert && adminCode) { adminCode = ""; derniere = new Date().getTime(); }       // lot 323 : approuvée
      if (st === 200 && d && d.ecran && !d.ecran.suivi_ouvert && !adminCode) { jeton = ""; horizon = 1; }     // jeton expiré côté serveur : on reverrouille
      if (st === 200 && d) { flux = d; hors = false; zoneErreur.style.display = "none"; } else { hors = true; }
      if (flux) { dessiner(); }
    });
  }
  function demarrerFlux() { phase = "flux"; dejaCharge = false; vus = {}; charger(); }

  // Départ : télé déjà appairée → contenu ; sinon code
  if (ADMIN || lire()) { demarrerFlux(); } else { demarrerAppairage(); }
  setInterval(charger, 8000);
  // Lot 317 : le triangle rouge avance avec l'heure (redessin toutes les 20 s) ; le Suivi Support se reverrouille après 5 min sans action
  setInterval(function () {
    if (mode === "planning" && flux) { dessiner(); }
    if (mode === "suivi" && jeton && new Date().getTime() - derniere > 300000) { jeton = ""; mode = "planning"; if (flux) { flux.ecran.suivi_ouvert = false; dessiner(); } }
  }, 20000);
})();
</script>
