<!doctype html>
<!--
  Lot 295 — Écran TV (Smart TV, navigateur de télé) : page AUTONOME, écrite en JavaScript ancien (ES5, sans React ni bundle),
  pour fonctionner même sur le vieux moteur web d'une télé (webOS, Tizen…) où l'application SAWALI complète reste blanche.
  Adresse : /tv (redirigée ici) ou directement /tv-ecran.html.
  Fonctionnement identique au lot 289 : code d'appairage à saisir dans Paramètres → « Écrans TV », puis fil de la messagerie
  et demandes de support du client choisi. Les appels passent par /api (même adresse que le site, relayée vers le serveur).
  Toute erreur est AFFICHÉE en bas de l'écran (au lieu d'un écran blanc) pour faciliter le diagnostic.
-->

<body>
<div id="racine"><div class="centre"><div class="aide">Chargement de l'écran SAWALI…</div></div></div>
<div id="erreur"></div>
<script>
(function () {
  var CLE = "sawali_tv_secret", API = "/api", VERSION_PAGE = "309";   // doit être identique à PAGE_TV_VERSION (backend/routes/ecran_tv.py)
  var secretMem = "", dejaCharge = false, vus = {}, flux = null, hors = false, phase = "", code = "";
  var ctxSon = null, sonActif = false, filChoisi = "", curseur = -1, dernierNonLus = -1, dernierFils = [];
  // Lot 303 — non-lus déjà « vus » sur cette télé, par conversation (gardés dans la télé : survit au rechargement de la page)
  var photosMed = {}, nbFlux = 0, mode = "", idxMed = 0, forces = {};   // lot 304 : mode = "planning" (par défaut) ou "suivi"; idxMed = médecin affiché au carrousel
        // lot 303 : photos des médecins (demandées au serveur au démarrage puis toutes les ~10 min)
  var CLE_LUS = "sawali_tv_lus", lus = {};
  try { lus = JSON.parse(localStorage.getItem(CLE_LUS) || "{}") || {}; } catch (e) { lus = {}; }
  function sauverLus() { try { localStorage.setItem(CLE_LUS, JSON.stringify(lus)); } catch (e) {} }
  // Non-lus affichés = non-lus du serveur moins ceux déjà vus ici ; si le serveur en compte moins (lus ailleurs), on s'aligne
  function nonLusVisibles(f) {
    var vu = lus[f.cle] || 0;
    if (f.non_lus < vu) { lus[f.cle] = vu = f.non_lus; sauverLus(); }
    return Math.max(0, f.non_lus - vu);
  }
  var racine = document.getElementById("racine"), zoneErreur = document.getElementById("erreur");

  // Toute erreur est affichée en bas de l'écran (diagnostic sur la télé, sans console)
  function montrerErreur(m) { zoneErreur.style.display = "block"; zoneErreur.innerHTML = esc(String(m)).substring(0, 300); }
  window.onerror = function (msg, src, ligne) { montrerErreur("Erreur : " + msg + " (ligne " + ligne + ")"); };

  function esc(t) { return String(t == null ? "" : t).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;"); }
  function lire() { try { return localStorage.getItem(CLE) || secretMem; } catch (e) { return secretMem; } }
  function ecrire(v) { secretMem = v; try { if (v) { localStorage.setItem(CLE, v); } else { localStorage.removeItem(CLE); } } catch (e) {} }
  function fabriquer() {
    var s = "", i, h = "0123456789abcdef", b;
    for (i = 0; i < 48; i++) {
      if (window.crypto && window.crypto.getRandomValues) { b = window.crypto.getRandomValues(new Uint8Array(1))[0] % 16; }
      else { b = Math.floor(Math.random() * 16); }
      s += h.charAt(b);
    }
    return s;
  }
  function heure(iso) { var d = new Date(iso); if (isNaN(d.getTime())) { return ""; } return ("0" + d.getHours()).slice(-2) + ":" + ("0" + d.getMinutes()).slice(-2); }
  function jourHeure(iso) { var d = new Date(iso); if (isNaN(d.getTime())) { return ""; } return ("0" + d.getDate()).slice(-2) + "/" + ("0" + (d.getMonth() + 1)).slice(-2) + " " + heure(iso); }

  // Appel au serveur (XMLHttpRequest : le plus compatible) ; rappel(statut, objet)
  function appeler(methode, chemin, secret, corps, rappel) {
    var x = new XMLHttpRequest();
    x.open(methode, API + chemin, true);
    x.timeout = 15000;
    if (secret) { x.setRequestHeader("X-Tv-Secret", secret); }
    if (corps) { x.setRequestHeader("Content-Type", "application/json"); }
    x.onreadystatechange = function () {
      if (x.readyState !== 4) { return; }
      var d = null;
      try { d = JSON.parse(x.responseText); } catch (e) {}
      rappel(x.status, d);
    };
    x.ontimeout = function () { rappel(0, null); };
    x.send(corps ? JSON.stringify(corps) : null);
  }

  // ---------- Son : bip à chaque nouveau message reçu ----------
  // Un navigateur de télé n'autorise le son qu'après une action de l'utilisateur (touche OK de la télécommande) : tant que ce n'est
  // pas fait, un petit bandeau « Appuyez sur OK » s'affiche en haut de l'écran.
  function activerSon() {
    try {
      var Ctx = window.AudioContext || window.webkitAudioContext;
      if (!Ctx) { return; }
      if (!ctxSon) { ctxSon = new Ctx(); }
      if (ctxSon.resume) { ctxSon.resume(); }
      if (!sonActif) { sonActif = true; bip(); if (flux) { dessiner(); } }
    } catch (e) { montrerErreur("Son indisponible : " + e.message); }
  }
  function bip() {
    if (!ctxSon || !sonActif) { return; }
    try {
      var t = ctxSon.currentTime, i, freqs = [880, 1175];
      for (i = 0; i < freqs.length; i++) {
        var o = ctxSon.createOscillator(), g = ctxSon.createGain();
        o.frequency.value = freqs[i]; o.type = "sine";
        g.gain.setValueAtTime(0.0001, t + i * 0.18);
        g.gain.exponentialRampToValueAtTime(0.4, t + i * 0.18 + 0.02);
        g.gain.exponentialRampToValueAtTime(0.0001, t + i * 0.18 + 0.16);
        o.connect(g); g.connect(ctxSon.destination);
        o.start(t + i * 0.18); o.stop(t + i * 0.18 + 0.17);
      }
    } catch (e) { /* son impossible : on ignore */ }
  }
  // Lot 303 : au chargement, on tente d'activer le son sans geste ; certaines télés l'autorisent, sinon le bandeau « Appuyez sur OK »
  // reste affiché (règle des navigateurs : le son exige une action de l'utilisateur à chaque chargement de page).
  function essaiSonAuto() {
    try {
      var Ctx = window.AudioContext || window.webkitAudioContext;
      if (!Ctx) { return; }
      ctxSon = ctxSon || new Ctx();
      if (ctxSon.resume) { ctxSon.resume(); }
      setTimeout(function () { if (ctxSon && ctxSon.state === "running" && !sonActif) { sonActif = true; if (flux) { dessiner(); } } }, 600);
    } catch (e) { /* pas de son automatique : on attend un appui sur OK */ }
  }
  essaiSonAuto();
  document.addEventListener("click", activerSon, false);
  document.addEventListener("keydown", activerSon, false);
  document.addEventListener("touchstart", activerSon, false);

  // ---------- Choix d'une conversation (clic de la télécommande pointeur, ou flèches + OK) ----------
  function choisirFil(cle) {
    filChoisi = (cle === filChoisi) ? "" : cle;     // un second clic sur la même conversation revient à « tout afficher »
    if (filChoisi) { marquerVu(filChoisi); if (flux) { dessiner(); } }   // lot 303 : la pastille rouge se met à jour aussitôt
    vus = {}; dejaCharge = false;                    // le contenu change : pas d'animation ni de bip pour l'affichage initial
    charger();
  }
  // Lot 304 : bascule entre le planning des médecins (défaut) et le suivi (messages + demandes de support)
  function basculer() { mode = (mode === "planning") ? "suivi" : "planning"; vus = {}; dejaCharge = false; if (flux) { dessiner(); } }
  // Carrousel : un médecin à la fois, on passe au suivant toutes les minutes
  setInterval(function () { if (mode === "planning" && flux) { idxMed++; dessiner(); } }, 60000);
  // Lot 303 : les non-lus d'une conversation ouverte sont considérés comme lus sur la télé
  function marquerVu(cle) {
    var i, fl = (flux && flux.fils) || [];
    for (i = 0; i < fl.length; i++) { if (fl[i].cle === cle) { lus[cle] = fl[i].non_lus; sauverLus(); } }
  }
  racine.addEventListener("click", function (e) {
    var n = e.target;
    while (n && n !== racine) {
      if (n.getAttribute && n.getAttribute("data-cle")) { choisirFil(n.getAttribute("data-cle")); return; }
      if (n.getAttribute && n.getAttribute("data-bascule")) { basculer(); return; }
      if (n.getAttribute && n.getAttribute("data-tout")) { if (filChoisi) { choisirFil(filChoisi); } return; }
      n = n.parentNode;
    }
  }, false);
  document.addEventListener("keydown", function (e) {
    var k = e.keyCode;
    if (k === 40 || k === 38) {                       // flèche bas / haut : parcourt les conversations
      if (dernierFils.length) { curseur = k === 40 ? Math.min(dernierFils.length - 1, curseur + 1) : Math.max(0, curseur - 1); dessiner(); }
      e.preventDefault();
    } else if (k === 13) {                            // OK : ouvre la conversation sous le curseur
      if (curseur >= 0 && dernierFils[curseur]) { choisirFil(dernierFils[curseur].cle); }
    } else if (k === 403 || k === 66) {               // touche rouge de la télécommande LG (ou B) : bascule planning / suivi
      basculer();
    } else if (k === 27 || k === 461 || k === 10009 || k === 8) {   // Échap / Retour (LG, Samsung) : tout afficher
      if (filChoisi) { choisirFil(filChoisi); }
    }
  }, false);

  // ---------- Phase « code » ----------
  function afficherCode() {
    racine.innerHTML = '<div class="centre"><b style="font-size:5vh">SAWALI — Écran TV</b><div class="code">' + esc(code || "······") +
      '</div><div class="aide">Dans SAWALI, ouvrez Paramètres → « Écrans TV », saisissez ce code, choisissez le client et les contenus à afficher. Cet écran démarrera aussitôt.</div></div>';
  }
  function demarrerAppairage() {
    phase = "code"; code = ""; afficherCode();
    var secret = fabriquer();
    appeler("POST", "/tv/appairage", null, { secret: secret }, function (st, d) {
      if (phase !== "code") { return; }
      if (st !== 200 || !d) { montrerErreur("Serveur injoignable (code " + st + ") — nouvel essai dans 10 s"); setTimeout(demarrerAppairage, 10000); return; }
      zoneErreur.style.display = "none";
      code = d.code; afficherCode();
      var attendre = function () {
        if (phase !== "code") { return; }
        appeler("GET", "/tv/appairage/" + d.appairage_id, secret, null, function (s2, e) {
          if (e && e.etat === "ok") { ecrire(secret); demarrerFlux(); return; }
          if (e && e.etat === "expire") { demarrerAppairage(); return; }
          setTimeout(attendre, 4000);
        });
      };
      setTimeout(attendre, 4000);
    });
  }

  // ---------- Phase « flux » ----------
  function dessiner() {
    var m = (flux && flux.ecran && flux.ecran.modules) || {}, h = "", i, msgs = (flux && flux.messages) || [], sup = (flux && flux.support) || [], fils = (flux && flux.fils) || [];
    var maintenant = new Date(), nouveauEntrant = false;
    var jours = ["dimanche", "lundi", "mardi", "mercredi", "jeudi", "vendredi", "samedi"];
    // Position de défilement du fil en direct avant le redessin : on reste en bas s'il y était ou si un message arrive
    var ancien = document.getElementById("direct"), etaitEnBas = !ancien || (ancien.scrollHeight - ancien.scrollTop - ancien.clientHeight < 80), ancienHaut = ancien ? ancien.scrollTop : 0;
    dernierFils = fils;
    for (i = 0; i < msgs.length; i++) { if (dejaCharge && !vus[msgs[i].id]) { if (msgs[i].sens === "entrant") { nouveauEntrant = true; } } }
    // Un nouveau non-lu dans une AUTRE conversation que celle affichée déclenche aussi le bip
    if (filChoisi) { marquerVu(filChoisi); }              // un message qui arrive dans la conversation ouverte est vu aussitôt
    var nl = 0;
    for (i = 0; i < fils.length; i++) { nl += nonLusVisibles(fils[i]); }
    if (dejaCharge && dernierNonLus >= 0 && nl > dernierNonLus) { nouveauEntrant = true; }
    dernierNonLus = nl;
    // Lot 304 : écran par défaut = planning des médecins (si le contenu « Hall » est activé), sinon suivi
    var hallOn = !!m.hall, suiviOn = !!(m.messagerie || m.support);
    if (!mode || (mode === "planning" && !hallOn) || (mode === "suivi" && !suiviOn)) { mode = hallOn ? "planning" : "suivi"; }
    h += '<div class="entete"><b>' + esc((flux && flux.ecran && flux.ecran.nom) || "SAWALI") + '</b><span>' + (hallOn && suiviOn ? '<span class="bascule" data-bascule="1" tabindex="0">⇄ ' + (mode === "planning" ? "Suivi Support" : "Planning des médecins") + "</span>" : "") +
      (mode !== "suivi" || sonActif || !m.messagerie ? "" : '<span class="badgeson">🔕 Appuyez sur OK pour activer le son</span>') +
      (hors ? "⚠ connexion perdue — dernier contenu affiché · " : "") + jours[maintenant.getDay()] + " " + jourHeure(maintenant.toISOString()) + '</span></div><div class="corps">';
    if (mode === "suivi" && m.messagerie) {
      h += '<div class="col" style="-webkit-flex:' + (m.support ? 2 : 1) + ';flex:' + (m.support ? 2 : 1) + '"><div class="titre">💬 Messagerie' +
        (nl ? ' <span class="pastille" style="display:inline-block">' + nl + "</span>" : "") + '</div><div class="msgzone">';
      // Conversations : nom du contact, dernier message, bulle rouge = messages non lus
      h += '<div class="listefils"><div class="astuce">Cliquez sur une conversation (ou flèches + OK)</div>';
      if (!fils.length) { h += '<div class="vide">Aucune conversation</div>'; }
      for (i = 0; i < fils.length; i++) {
        h += '<div class="fil1' + (i === curseur ? " curs" : "") + (fils[i].cle === filChoisi ? " choisi" : "") + '" data-cle="' + esc(fils[i].cle) + '" tabindex="0"><div class="corps1"><div class="n">' + esc(fils[i].nom) + '</div><div class="d">' + (fils[i].sens === "sortant" ? "↗ " : "") + (fils[i].agent ? "🤖 " + esc(fils[i].agent) + " : " : "") + esc(fils[i].dernier) + '</div></div><span class="h">' + heure(fils[i].date) + "</span>" +
          (nonLusVisibles(fils[i]) ? '<span class="pastille">' + nonLusVisibles(fils[i]) + "</span>" : "") + "</div>";
      }
      h += '</div><div class="zone-direct">';
      if (filChoisi) {
        var nomFil = "";
        for (i = 0; i < fils.length; i++) { if (fils[i].cle === filChoisi) { nomFil = fils[i].nom; } }
        // La barre reste fixe au-dessus du fil (hors de la zone qui défile)
        h += '<div class="barre-fil" data-tout="1" style="position:absolute;top:0;left:0;right:1vw;height:9vh;box-sizing:border-box;margin:0;overflow:hidden">💬 ' + esc(nomFil || "Conversation") + " — cliquez ici ou touche Retour pour tout afficher</div>";
      }
      h += '<div class="direct" id="direct" style="top:' + (filChoisi ? "10.5vh" : "0") + '">';
      if (!msgs.length) { h += '<div class="vide">Aucun message récent</div>'; }
      for (i = 0; i < msgs.length; i++) {
        var g = msgs[i], nouveau = dejaCharge && !vus[g.id];
        h += '<div class="rang ' + (g.sens === "entrant" ? "" : "droite") + '"><div class="bulle ' + (g.sens === "entrant" ? "entrant" : "sortant") + (nouveau ? " nouveau" : "") + '"><div class="nom">' + esc(g.nom) + " · " + heure(g.date) + (g.agent ? ' <span class="agentia">🤖 ' + esc(g.agent) + "</span>" : "") + "</div>" + esc(g.texte) + "</div></div>";
      }
      h += "</div></div></div></div>";
    }
    if (mode === "suivi" && m.support) {
      h += '<div class="col"><div class="titre">🛟 Demandes de support ouvertes</div>';
      if (!sup.length) { h += '<div class="vide">Aucune demande en cours</div>'; }
      for (i = 0; i < sup.length && i < 6; i++) {
        h += '<div class="ticket"><b>' + esc(sup[i].numero) + "</b> — " + esc(sup[i].motif) + "<small>" + (sup[i].contact ? esc(sup[i].contact) + " · " : "") + jourHeure(sup[i].date) + "</small></div>";
      }
      h += "</div>";
    }
    if (mode === "planning") {
      // Lot 304 — planning des médecins en carrousel : un médecin à la fois (changement toutes les minutes), données ANONYMISÉES par le serveur
      var hall = (flux && flux.hall) || { medecins: [], prochain: null }, liste = [], k2;
      for (i = 0; i < hall.medecins.length; i++) {
        var mm = hall.medecins[i], actif = false, tous = (mm.rdv || []).concat(mm.sans_rdv || []);
        for (k2 = 0; k2 < tous.length; k2++) { if (!tous[k2].passe) { actif = true; } }   // au moins un patient pas encore passé (RDV ou sans RDV)
        if (actif) { liste.push(mm); }
      }
      if (!liste.length) { for (i = 0; i < hall.medecins.length; i++) { if ((hall.medecins[i].rdv || []).length || (hall.medecins[i].sans_rdv || []).length) { liste.push(hall.medecins[i]); } } }
      // À l'approche d'un RDV (moins de 5 minutes) le médecin concerné passe à l'écran, une seule fois par RDV
      for (i = 0; i < liste.length; i++) {
        var pm = liste[i].prochain_min, cleU = liste[i].medecin + "|" + liste[i].prochain_min + "|" + (liste[i].rdv || []).length;
        if (pm !== null && pm >= 0 && pm <= 5 && !forces[cleU]) { forces[cleU] = true; idxMed = i; }
      }
      h += '<div class="plan t-' + esc((flux && flux.ecran && flux.ecran.taille_heure) || "grande") + '">';
      if (!liste.length) {
        h += '<div class="centre"><div class="vide">Aucun rendez-vous prévu aujourd\'hui</div></div>';
      } else {
        var md = liste[idxMed % liste.length], pts = "";
        h += '<div class="carte-med">' + (photosMed[md.medecin] ? '<img class="photo-g" src="' + photosMed[md.medecin] + '" alt="">' : '<div class="photo-g sans-photo">🩺</div>') +
          '<div><div class="nom-g">' + esc(md.medecin) + '</div>' + (md.profession ? '<div class="titre-g">' + esc(md.profession) + "</div>" : "") +
          (md.porte ? '<span class="porte-g">' + esc(md.porte) + "</span>" : "") +
          (md.prochain_min !== null && md.prochain_min >= 0 && md.prochain_min <= 30 ? '<span class="bientot">Prochain RDV dans ' + md.prochain_min + " min</span>" : "") + "</div></div>";
        var lstR = md.rdv || [], lstS = md.sans_rdv || [];
        // Une ligne : « heure (ou N°) | identité anonymisée | téléphone masqué | reçu » ; vert = en consultation, estompée = déjà passé
        var ligneHtml = function (r, sans) {
          return '<div class="ligne-rdv' + (r.etat === "en_cours" ? " consult" : (r.passe ? " fini" : "")) + '"><span class="hr">' + (sans ? "N° " + esc(r.ordre) : esc(r.heure)) + '</span><span class="qui">' + esc(r.qui) + " | " + esc(r.tel || "—") +
            (r.recu ? " | " + esc(r.recu) : "") + (r.etat === "en_cours" ? '<span class="enc-txt">▶ En consultation</span>' : "") + "</span></div>";
        };
        h += '<div class="liste-rdv deux-col">';
        if (!lstR.length && !lstS.length) { h += '<div class="vide">Aucun rendez-vous</div>'; }
        if (lstR.length) {
          h += "<div>" + (lstS.length ? '<div class="sous-titre">Avec rendez-vous</div>' : "");
          for (k2 = 0; k2 < lstR.length; k2++) { h += ligneHtml(lstR[k2], false); }
          h += "</div>";
        }
        if (lstS.length) {
          h += '<div><div class="sous-titre">Sans rendez-vous</div>';
          for (k2 = 0; k2 < lstS.length; k2++) { h += ligneHtml(lstS[k2], true); }
          h += "</div>";
        }
        h += "</div>";
        for (i = 0; i < liste.length; i++) { pts += (i === idxMed % liste.length ? "<b>●</b> " : "○ "); }
        h += '<div class="points">' + pts + "</div>";
      }
      h += "</div>";
    }
    if (!m.messagerie && !m.support && !m.hall) { h += '<div class="centre"><div class="vide">Aucun contenu choisi pour cet écran</div></div>'; }
    racine.innerHTML = h + "</div>";
    var el = document.getElementById("direct");
    if (el) { el.scrollTop = (etaitEnBas || nouveauEntrant) ? el.scrollHeight : ancienHaut; }   // défilement automatique vers le dernier message
    if (nouveauEntrant && mode === "suivi") { bip(); }                                                                // bip à chaque nouveau message reçu
    for (i = 0; i < msgs.length; i++) { vus[msgs[i].id] = true; }
    dejaCharge = true;
  }
  function charger() {
    if (phase !== "flux") { return; }
    var avecPhotos = (nbFlux % 75 === 0);   // les photos (lourdes) ne sont demandées qu'au premier appel puis de temps en temps
    nbFlux++;
    appeler("GET", "/tv/flux?photos=" + (avecPhotos ? "1" : "0") + (filChoisi ? "&fil=" + encodeURIComponent(filChoisi) : ""), lire(), null, function (st, d) {
      if (phase !== "flux") { return; }
      if (st === 200 && d && d.hall && avecPhotos) {
        var q; photosMed = {};
        for (q = 0; q < d.hall.medecins.length; q++) { if (d.hall.medecins[q].photo) { photosMed[d.hall.medecins[q].medecin] = d.hall.medecins[q].photo; } }
      } else if (st === 200 && d && d.hall) {
        // une photo vient d'être ajoutée côté administration : on la demande au prochain appel
        var r2; for (r2 = 0; r2 < d.hall.medecins.length; r2++) { if (d.hall.medecins[r2].a_photo && !photosMed[d.hall.medecins[r2].medecin]) { nbFlux = 0; } }
      }
      if (st === 401) { ecrire(""); flux = null; demarrerAppairage(); return; }
      // Lot 307 : le serveur annonce la version de la page ; si la télé a gardé une ancienne page en cache, elle se recharge
      // toute seule (adresse avec ?v= pour contourner le cache ; au plus 2 tentatives, pour ne jamais boucler)
      if (st === 200 && d && d.page && d.page !== VERSION_PAGE) {
        var essais = 0;
        try { essais = parseInt(sessionStorage.getItem("sawali_tv_rech") || "0", 10) || 0; } catch (e) {}
        if (essais < 2) {
          try { sessionStorage.setItem("sawali_tv_rech", String(essais + 1)); } catch (e) {}
          window.location.replace("/tv-ecran.html?v=" + encodeURIComponent(d.page) + "&t=" + new Date().getTime());
          return;
        }
      }
      if (st === 200 && d) { flux = d; hors = false; zoneErreur.style.display = "none"; } else { hors = true; }
      if (flux) { dessiner(); }
    });
  }
  function demarrerFlux() { phase = "flux"; dejaCharge = false; vus = {}; charger(); }

  // Départ : télé déjà appairée → contenu ; sinon code
  if (lire()) { demarrerFlux(); } else { demarrerAppairage(); }
  setInterval(charger, 8000);
})();
</script>
</body>
</html>
