<!doctype html>
<!--
  Lot 295 — Écran TV (Smart TV, navigateur de télé) : page AUTONOME, écrite en JavaScript ancien (ES5, sans React ni bundle),
  pour fonctionner même sur le vieux moteur web d'une télé (webOS, Tizen…) où l'application SAWALI complète reste blanche.
  Adresse : /tv (redirigée ici) ou directement /tv-ecran.html.
  Fonctionnement identique au lot 289 : code d'appairage à saisir dans Paramètres → « Écrans TV », puis fil de la messagerie
  et demandes de support du client choisi. Les appels passent par /api (même adresse que le site, relayée vers le serveur).
  Toute erreur est AFFICHÉE en bas de l'écran (au lieu d'un écran blanc) pour faciliter le diagnostic.
-->
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SAWALI — Écran TV</title>
<style>
html,body{margin:0;padding:0;height:100%;background:#0b1220;color:#f1f5f9;font-family:Arial,Helvetica,sans-serif;overflow:hidden}
#racine{position:fixed;top:0;left:0;right:0;bottom:0;display:-webkit-flex;display:flex;-webkit-flex-direction:column;flex-direction:column}
.entete{display:-webkit-flex;display:flex;-webkit-justify-content:space-between;justify-content:space-between;-webkit-align-items:center;align-items:center;padding:1.2vh 2.5vw;background:#111b30;border-bottom:2px solid #1e3a5f;font-size:3vh}
.entete b{font-size:3.4vh}
.corps{-webkit-flex:1;flex:1;display:-webkit-flex;display:flex;min-height:0}
.col{-webkit-flex:1;flex:1;display:-webkit-flex;display:flex;-webkit-flex-direction:column;flex-direction:column;min-width:0;padding:2vh 2vw}
.col+.col{border-left:2px solid #1e3a5f}
.titre{font-size:3.2vh;color:#7dd3fc;margin-bottom:1.5vh}
.fil{-webkit-flex:1;flex:1;display:-webkit-flex;display:flex;-webkit-flex-direction:column;flex-direction:column;min-height:0}
.bulle{max-width:82%;margin-top:1.4vh;padding:1.4vh 1.6vw;border-radius:2vh;font-size:3.1vh;line-height:1.3;word-wrap:break-word}
.entrant{-webkit-align-self:flex-start;align-self:flex-start;background:#1f2a44}
.sortant{-webkit-align-self:flex-end;align-self:flex-end;background:#0f5d4f}
.nom{font-size:2.2vh;color:#94a3b8;margin-bottom:.4vh}
.nouveau{-webkit-animation:arrivee .7s ease-out;animation:arrivee .7s ease-out}
@-webkit-keyframes arrivee{from{opacity:0;-webkit-transform:translateY(5vh)}to{opacity:1;-webkit-transform:none}}
@keyframes arrivee{from{opacity:0;transform:translateY(5vh)}to{opacity:1;transform:none}}
.ticket{background:#1c2540;border-left:1vh solid #f59e0b;border-radius:1.2vh;padding:1.4vh 1.4vw;margin-bottom:1.4vh;font-size:3vh}
.ticket small{display:block;color:#94a3b8;font-size:2.2vh;margin-top:.4vh}
.vide{color:#64748b;font-size:3vh;margin-top:4vh;text-align:center}
.centre{-webkit-flex:1;flex:1;display:-webkit-flex;display:flex;-webkit-flex-direction:column;flex-direction:column;-webkit-align-items:center;align-items:center;-webkit-justify-content:center;justify-content:center;text-align:center;padding:4vh}
.code{font-size:16vh;letter-spacing:.3em;font-weight:bold;color:#38bdf8;margin:3vh 0;font-family:Consolas,"Courier New",monospace}
.aide{font-size:3.4vh;color:#cbd5e1;max-width:80vw;line-height:1.5}
.msgzone{-webkit-flex:1;flex:1;display:-webkit-flex;display:flex;min-height:0}
.listefils{width:36%;overflow:hidden;padding-right:1.2vw;border-right:2px solid #1e3a5f;margin-right:1.2vw}
.fil1{display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;padding:1.1vh .8vw;border-radius:1.2vh;margin-bottom:.8vh;background:#16203a}
.fil1 .corps1{-webkit-flex:1;flex:1;min-width:0}
.fil1 .n{font-size:2.8vh;font-weight:bold;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fil1 .d{font-size:2.2vh;color:#94a3b8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fil1 .h{font-size:2vh;color:#94a3b8;margin-left:.6vw}
.pastille{min-width:3.6vh;height:3.6vh;line-height:3.6vh;border-radius:1.8vh;background:#ef4444;color:#fff;text-align:center;font-size:2.3vh;font-weight:bold;margin-left:.8vw;padding:0 .5vh}
.direct{-webkit-flex:1;flex:1;display:-webkit-flex;display:flex;-webkit-flex-direction:column;flex-direction:column;min-width:0;overflow-y:scroll}
.direct::-webkit-scrollbar,.listefils::-webkit-scrollbar{width:1.4vh}
.direct::-webkit-scrollbar-track{background:#111b30}
.direct::-webkit-scrollbar-thumb{background:#38bdf8;border-radius:.7vh}
.badgeson{background:#f59e0b;color:#111;border-radius:1vh;padding:.3vh 1vw;font-size:2.2vh;margin-right:1vw}
#erreur{position:fixed;left:0;right:0;bottom:0;background:#7f1d1d;color:#fff;font-size:2vh;padding:.8vh 1.5vw;display:none}
</style>
</head>
<body>
<div id="racine"><div class="centre"><div class="aide">Chargement de l'écran SAWALI…</div></div></div>
<div id="erreur"></div>
<script>
(function () {
  var CLE = "sawali_tv_secret", API = "/api";
  var secretMem = "", dejaCharge = false, vus = {}, flux = null, hors = false, phase = "", code = "";
  var ctxSon = null, sonActif = false;
  var racine = document.getElementById("racine"), zoneErreur = document.getElementById("erreur");

  // Toute erreur est affichée en bas de l'écran (diagnostic sur la télé, sans console)
  function montrerErreur(m) { zoneErreur.style.display = "block"; zoneErreur.innerHTML = esc(String(m)).substring(0, 300); }
  window.onerror = function (msg, src, ligne) { montrerErreur("Erreur : " + msg + " (ligne " + ligne + ")"); };

  function esc(t) { return String(t == null ? "" : t).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;"); }
  function lire() { try { return localStorage.getItem(CLE) || secretMem; } catch (e) { return secretMem; } }
  function ecrire(v) { secretMem = v; try { if (v) { localStorage.setItem(CLE, v); } else { localStorage.removeItem(CLE); } } catch (e) {} }
  function fabriquer() {
    var s = "", i, h = "0123456789abcdef", b;
    for (i = 0; i < 48; i++) {
      if (window.crypto && window.crypto.getRandomValues) { b = window.crypto.getRandomValues(new Uint8Array(1))[0] % 16; }
      else { b = Math.floor(Math.random() * 16); }
      s += h.charAt(b);
    }
    return s;
  }
  function heure(iso) { var d = new Date(iso); if (isNaN(d.getTime())) { return ""; } return ("0" + d.getHours()).slice(-2) + ":" + ("0" + d.getMinutes()).slice(-2); }
  function jourHeure(iso) { var d = new Date(iso); if (isNaN(d.getTime())) { return ""; } return ("0" + d.getDate()).slice(-2) + "/" + ("0" + (d.getMonth() + 1)).slice(-2) + " " + heure(iso); }

  // Appel au serveur (XMLHttpRequest : le plus compatible) ; rappel(statut, objet)
  function appeler(methode, chemin, secret, corps, rappel) {
    var x = new XMLHttpRequest();
    x.open(methode, API + chemin, true);
    x.timeout = 15000;
    if (secret) { x.setRequestHeader("X-Tv-Secret", secret); }
    if (corps) { x.setRequestHeader("Content-Type", "application/json"); }
    x.onreadystatechange = function () {
      if (x.readyState !== 4) { return; }
      var d = null;
      try { d = JSON.parse(x.responseText); } catch (e) {}
      rappel(x.status, d);
    };
    x.ontimeout = function () { rappel(0, null); };
    x.send(corps ? JSON.stringify(corps) : null);
  }

  // ---------- Son : bip à chaque nouveau message reçu ----------
  // Un navigateur de télé n'autorise le son qu'après une action de l'utilisateur (touche OK de la télécommande) : tant que ce n'est
  // pas fait, un petit bandeau « Appuyez sur OK » s'affiche en haut de l'écran.
  function activerSon() {
    try {
      var Ctx = window.AudioContext || window.webkitAudioContext;
      if (!Ctx) { return; }
      if (!ctxSon) { ctxSon = new Ctx(); }
      if (ctxSon.resume) { ctxSon.resume(); }
      if (!sonActif) { sonActif = true; bip(); if (flux) { dessiner(); } }
    } catch (e) { montrerErreur("Son indisponible : " + e.message); }
  }
  function bip() {
    if (!ctxSon || !sonActif) { return; }
    try {
      var t = ctxSon.currentTime, i, freqs = [880, 1175];
      for (i = 0; i < freqs.length; i++) {
        var o = ctxSon.createOscillator(), g = ctxSon.createGain();
        o.frequency.value = freqs[i]; o.type = "sine";
        g.gain.setValueAtTime(0.0001, t + i * 0.18);
        g.gain.exponentialRampToValueAtTime(0.4, t + i * 0.18 + 0.02);
        g.gain.exponentialRampToValueAtTime(0.0001, t + i * 0.18 + 0.16);
        o.connect(g); g.connect(ctxSon.destination);
        o.start(t + i * 0.18); o.stop(t + i * 0.18 + 0.17);
      }
    } catch (e) { /* son impossible : on ignore */ }
  }
  document.addEventListener("click", activerSon, false);
  document.addEventListener("keydown", activerSon, false);
  document.addEventListener("touchstart", activerSon, false);

  // ---------- Phase « code » ----------
  function afficherCode() {
    racine.innerHTML = '<div class="centre"><b style="font-size:5vh">SAWALI — Écran TV</b><div class="code">' + esc(code || "······") +
      '</div><div class="aide">Dans SAWALI, ouvrez Paramètres → « Écrans TV », saisissez ce code, choisissez le client et les contenus à afficher. Cet écran démarrera aussitôt.</div></div>';
  }
  function demarrerAppairage() {
    phase = "code"; code = ""; afficherCode();
    var secret = fabriquer();
    appeler("POST", "/tv/appairage", null, { secret: secret }, function (st, d) {
      if (phase !== "code") { return; }
      if (st !== 200 || !d) { montrerErreur("Serveur injoignable (code " + st + ") — nouvel essai dans 10 s"); setTimeout(demarrerAppairage, 10000); return; }
      zoneErreur.style.display = "none";
      code = d.code; afficherCode();
      var attendre = function () {
        if (phase !== "code") { return; }
        appeler("GET", "/tv/appairage/" + d.appairage_id, secret, null, function (s2, e) {
          if (e && e.etat === "ok") { ecrire(secret); demarrerFlux(); return; }
          if (e && e.etat === "expire") { demarrerAppairage(); return; }
          setTimeout(attendre, 4000);
        });
      };
      setTimeout(attendre, 4000);
    });
  }

  // ---------- Phase « flux » ----------
  function dessiner() {
    var m = (flux && flux.ecran && flux.ecran.modules) || {}, h = "", i, msgs = (flux && flux.messages) || [], sup = (flux && flux.support) || [], fils = (flux && flux.fils) || [];
    var maintenant = new Date(), nouveauEntrant = false;
    var jours = ["dimanche", "lundi", "mardi", "mercredi", "jeudi", "vendredi", "samedi"];
    // Position de défilement du fil en direct avant le redessin : on reste en bas s'il y était ou si un message arrive
    var ancien = document.getElementById("direct"), etaitEnBas = !ancien || (ancien.scrollHeight - ancien.scrollTop - ancien.clientHeight < 80), ancienHaut = ancien ? ancien.scrollTop : 0;
    for (i = 0; i < msgs.length; i++) { if (dejaCharge && !vus[msgs[i].id]) { if (msgs[i].sens === "entrant") { nouveauEntrant = true; } } }
    h += '<div class="entete"><b>' + esc((flux && flux.ecran && flux.ecran.nom) || "SAWALI") + '</b><span>' +
      (sonActif ? "" : '<span class="badgeson">🔕 Appuyez sur OK pour activer le son</span>') +
      (hors ? "⚠ connexion perdue — dernier contenu affiché · " : "") + jours[maintenant.getDay()] + " " + jourHeure(maintenant.toISOString()) + '</span></div><div class="corps">';
    if (m.messagerie) {
      h += '<div class="col" style="-webkit-flex:' + (m.support ? 2 : 1) + ';flex:' + (m.support ? 2 : 1) + '"><div class="titre">💬 Messagerie' +
        (flux && flux.non_lus_total ? ' <span class="pastille" style="display:inline-block">' + flux.non_lus_total + "</span>" : "") + '</div><div class="msgzone">';
      // Conversations : nom du contact, dernier message, bulle rouge = messages non lus
      h += '<div class="listefils">';
      if (!fils.length) { h += '<div class="vide">Aucune conversation</div>'; }
      for (i = 0; i < fils.length; i++) {
        h += '<div class="fil1"><div class="corps1"><div class="n">' + esc(fils[i].nom) + '</div><div class="d">' + (fils[i].sens === "sortant" ? "↗ " : "") + esc(fils[i].dernier) + '</div></div><span class="h">' + heure(fils[i].date) + "</span>" +
          (fils[i].non_lus ? '<span class="pastille">' + fils[i].non_lus + "</span>" : "") + "</div>";
      }
      h += '</div><div class="direct" id="direct"><div style="-webkit-flex:1;flex:1"></div>';
      if (!msgs.length) { h += '<div class="vide">Aucun message récent</div>'; }
      for (i = 0; i < msgs.length; i++) {
        var g = msgs[i], nouveau = dejaCharge && !vus[g.id];
        h += '<div class="bulle ' + (g.sens === "entrant" ? "entrant" : "sortant") + (nouveau ? " nouveau" : "") + '"><div class="nom">' + esc(g.nom) + " · " + heure(g.date) + "</div>" + esc(g.texte) + "</div>";
      }
      h += "</div></div></div>";
    }
    if (m.support) {
      h += '<div class="col"><div class="titre">🛟 Demandes de support ouvertes</div>';
      if (!sup.length) { h += '<div class="vide">Aucune demande en cours</div>'; }
      for (i = 0; i < sup.length && i < 6; i++) {
        h += '<div class="ticket"><b>' + esc(sup[i].numero) + "</b> — " + esc(sup[i].motif) + "<small>" + (sup[i].contact ? esc(sup[i].contact) + " · " : "") + jourHeure(sup[i].date) + "</small></div>";
      }
      h += "</div>";
    }
    if (!m.messagerie && !m.support) { h += '<div class="centre"><div class="vide">Aucun contenu choisi pour cet écran</div></div>'; }
    racine.innerHTML = h + "</div>";
    var el = document.getElementById("direct");
    if (el) { el.scrollTop = (etaitEnBas || nouveauEntrant) ? el.scrollHeight : ancienHaut; }   // défilement automatique vers le dernier message
    if (nouveauEntrant) { bip(); }                                                                // bip à chaque nouveau message reçu
    for (i = 0; i < msgs.length; i++) { vus[msgs[i].id] = true; }
    dejaCharge = true;
  }
  function charger() {
    if (phase !== "flux") { return; }
    appeler("GET", "/tv/flux", lire(), null, function (st, d) {
      if (phase !== "flux") { return; }
      if (st === 401) { ecrire(""); flux = null; demarrerAppairage(); return; }
      if (st === 200 && d) { flux = d; hors = false; zoneErreur.style.display = "none"; } else { hors = true; }
      if (flux) { dessiner(); }
    });
  }
  function demarrerFlux() { phase = "flux"; dejaCharge = false; vus = {}; charger(); }

  // Départ : télé déjà appairée → contenu ; sinon code
  if (lire()) { demarrerFlux(); } else { demarrerAppairage(); }
  setInterval(charger, 8000);
})();
</script>
</body>
</html>
